name: CRM read-only example

on:
  pull_request:
    branches: [main]
    paths:
      - "examples/crm_readonly_mcp/**"
      - "tests/test_crm_readonly_mcp.py"
      - ".github/workflows/crm-readonly-example.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crm-example:
    name: Synthetic CRM / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development tools and pinned demo SDK
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -r examples/crm_readonly_mcp/requirements.txt
      - name: Lint example and tests
        run: python -m ruff check examples/crm_readonly_mcp tests/test_crm_readonly_mcp.py
      - name: Type check example
        run: python -m mypy --strict -p examples.crm_readonly_mcp
      - name: Test example, including real MCP stdio transport
        run: python -m pytest tests/test_crm_readonly_mcp.py
      - name: Reproduce checked-in demonstration output
        run: |
          python -m examples.crm_readonly_mcp.demo > /tmp/crm-demo-output.txt
          diff -u examples/crm_readonly_mcp/DEMO_OUTPUT.txt /tmp/crm-demo-output.txt
      - name: Print actual MCP smoke output
        run: python -m examples.crm_readonly_mcp.smoke_test
